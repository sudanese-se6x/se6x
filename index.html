<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الفيديوهات الحصري</title>
    <!-- مكتبة فك الملفات المضغوطة JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b0c10; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 950px; padding: 15px; }
        
        /* شاشة تسجيل الدخول */
        #login-box { background: #15161d; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; max-width: 420px; margin: auto; border: 1px solid #23242e; }
        #login-box h2 { margin-bottom: 10px; color: #f1f1f1; font-size: 22px; }
        #login-box p { color: #8c92a4; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #2a2b36; border-radius: 8px; background: #0f1015; color: #fff; font-size: 16px; outline: none; transition: 0.3s; text-align: center; letter-spacing: 1px; }
        input[type="text"]:focus { border-color: #007bff; }
        button { padding: 14px 25px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #444; cursor: not-allowed; }
        .msg { margin-top: 15px; font-size: 14px; min-height: 20px; }
        .error { color: #ff4d4d; font-weight: bold; }
        .success { color: #ffc107; font-weight: bold; }

        /* واجهة المعرض والمجلدات */
        #app-content { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #23242e; padding-bottom: 12px; gap: 10px; }
        .header-title-box { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .header h1 { font-size: 16px; color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .header-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .action-btn { background: #333; color: #fff; border: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: #444; }
        .logout-btn { background: #dc3545; }
        .logout-btn:hover { background: #b02a37; }

        /* شبكة المعرض (Gallery Grid) */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        }

        /* تصميم بطاقة الفيديو */
        .card { background: #15161d; border-radius: 6px; overflow: hidden; position: relative; aspect-ratio: 9/12; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid #23242e; transition: transform 0.1s; }
        .card:active { transform: scale(0.97); }
        
        .card-thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #1f2029; }
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 8px 6px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 2; }
        
        .card-duration { font-size: 11px; color: #fff; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.9); background: rgba(0,0,0,0.4); padding: 2px 4px; border-radius: 4px; }
        .card-title { font-size: 10px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        
        /* فولدر أو ملف مضغوط */
        .folder-card { background: #15161d; border-radius: 6px; aspect-ratio: 9/12; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #23242e; padding: 10px; text-align: center; }
        .folder-icon { font-size: 35px; margin-bottom: 8px; }
        .folder-title { font-size: 12px; color: #e1e1e6; word-break: break-all; }

        /* مشغل الفيديو */
        #player-container { display: none; text-align: center; background: #15161d; padding: 15px; border-radius: 12px; border: 1px solid #23242e; max-width: 500px; margin: auto; }
        video { width: 100%; max-height: 400px; border-radius: 8px; outline: none; background: #000; margin-bottom: 12px; }
        .back-btn { background: #333; width: auto; display: inline-block; padding: 10px 20px; font-size: 14px; border-radius: 6px; }
        .back-btn:hover { background: #444; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة تسجيل الدخول -->
        <div id="login-box">
            <h2>تسجيل الدخول للمنصة</h2>
            <p>أدخل الكود الخاص لجهازك للمتابعة:</p>
            <input type="text" id="code-input" placeholder="اكتب الكود هنا...">
            <button id="login-btn" onclick="verifyCode()">دخول</button>
            <div id="msg" class="msg"></div>
        </div>

        <!-- 2. واجهة المعرض والمجلدات -->
        <div id="app-content">
            <div class="header">
                <div class="header-title-box">
                    <h1 id="path-title">📁 الملفات الرئيسية</h1>
                </div>
                <div class="header-btns">
                    <button id="back-nav-btn" class="action-btn hidden" onclick="goBackHierarchy()">رجوع</button>
                    <button class="action-btn logout-btn" onclick="logout()">خروج</button>
                </div>
            </div>
            <div id="items-grid" class="grid-container">
                <!-- محتوى المعرض -->
            </div>
        </div>

        <!-- 3. مشغل الفيديو -->
        <div id="player-container">
            <h2 id="video-title" style="margin-bottom: 10px; font-size: 15px; color: #ddd;">مشاهدة الفيديو</h2>
            <video id="main-video" controls controlsList="nodownload" oncontextmenu="return false;">
                <source id="video-source" src="" type="video/mp4">
            </video>
            <br>
            <button class="back-btn" onclick="closePlayer()">رجوع للمعرض</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgjvHsbhPbpbtRyrFq1mpqKU3tgneQR2kyWyyXXdkjOZ2cyhLb_L8AJMdYVk8AnzqMUg/exec";
        const GITHUB_USER = "esam98";
        const GITHUB_REPO = "my-site";
        
        let currentPath = ""; 
        let currentZipData = null;
        let currentZipName = "";
        let currentInternalPath = "";

        window.onload = function() {
            if (sessionStorage.getItem("device_logged_in") === "true") {
                showApp();
            }
        };

        function getDeviceId() {
            let deviceId = localStorage.getItem('unique_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('unique_device_id', deviceId);
            }
            return deviceId;
        }

        async function verifyCode() {
            const code = document.getElementById('code-input').value.trim();
            const msg = document.getElementById('msg');
            const loginBtn = document.getElementById('login-btn');
            
            if (!code) {
                msg.className = "msg error";
                msg.textContent = "الرجاء إدخال الكود.";
                return;
            }

            msg.className = "msg success";
            msg.textContent = "⏳ جاري التحقق وتسجيل الدخول...";
            loginBtn.disabled = true;

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ code: code, deviceId: getDeviceId() })
                });
                
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (e) {
                    result = { status: "error", message: "استجابة غير صالحة من السيرفر" };
                }

                if (result.status === "success") {
                    sessionStorage.setItem("device_logged_in", "true");
                    showApp();
                } else {
                    msg.className = "msg error";
                    msg.textContent = result.message || "الكود غير صحيح!";
                    loginBtn.disabled = false;
                }
            } catch (error) {
                msg.className = "msg error";
                msg.textContent = "حدث خطأ في الاتصال، حاول مرة أخرى.";
                loginBtn.disabled = false;
            }
        }

        function showApp() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-content').style.display = "block";
            loadFolderContent("");
        }

        function logout() {
            sessionStorage.removeItem("device_logged_in");
            location.reload();
        }

        function updateBackButtonVisibility() {
            let backBtn = document.getElementById('back-nav-btn');
            if (currentPath !== "" || (currentZipData !== null && currentInternalPath !== "")) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }
        }

        function goBackHierarchy() {
            if (currentZipData !== null) {
                if (currentInternalPath === "") {
                    currentZipData = null;
                    loadFolderContent(currentPath);
                } else {
                    let parentPath = currentInternalPath.substring(0, currentInternalPath.lastIndexOf('/', currentInternalPath.length - 2) + 1);
                    renderZipFolder(parentPath);
                }
            } else {
                let parentPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                loadFolderContent(parentPath);
            }
        }

        async function loadFolderContent(path) {
            currentPath = path;
            currentZipData = null;
            updateBackButtonVisibility();
            const grid = document.getElementById('items-grid');
            const pathTitle = document.getElementById('path-title');
            
            grid.innerHTML = "<p style='color:#8c92a4; grid-column: 1/-1; text-align:center;'>جاري جلب الملفات...</p>";
            pathTitle.textContent = path === "" ? "📁 الملفات الرئيسية" : `📁 / ${path}`;

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
                const res = await fetch(apiUrl);
                const items = await res.json();

                grid.innerHTML = "";

                if (!Array.isArray(items) || items.length === 0) {
                    if (path === "") {
                        grid.innerHTML = "<p style='color:#8c92a4; grid-column: 1/-1; text-align:center;'>المستودع فارغ. ارفع ملفاتك المضغوطة (ZIP) هنا!</p>";
                    }
                    return;
                }

                items.forEach(item => {
                    if (item.name === "index.html") return;

                    let ext = item.name.split('.').pop().toLowerCase();

                    if (item.type === "dir") {
                        let card = document.createElement('div');
                        card.className = "folder-card";
                        card.innerHTML = `<div class="folder-icon">📁</div><div class="folder-title">${item.name}</div>`;
                        card.onclick = () => loadFolderContent(item.path);
                        grid.appendChild(card);
                    } else if (ext === "zip") {
                        let card = document.createElement('div');
                        card.className = "folder-card";
                        card.innerHTML = `<div class="folder-icon">📦</div><div class="folder-title">${item.name}</div>`;
                        card.onclick = () => openZipFile(item.name, item.download_url);
                        grid.appendChild(card);
                    }
                });

            } catch (err) {
                grid.innerHTML = "<p style='color:#ff4d4d; grid-column: 1/-1; text-align:center;'>فشل في جلب الملفات.</p>";
            }
        }

        async function openZipFile(name, downloadUrl) {
            const grid = document.getElementById('items-grid');
            const pathTitle = document.getElementById('path-title');
            grid.innerHTML = "<p style='color:#8c92a4; grid-column: 1/-1; text-align:center;'>⏳ جاري تحميل وفك الملف المضغوط...</p>";
            pathTitle.textContent = `📦 / ${name}`;

            try {
                const response = await fetch(downloadUrl);
                const blob = await response.blob();
                const zip = new JSZip();
                currentZipData = await zip.loadAsync(blob);
                currentZipName = name;
                renderZipFolder("");
            } catch (err) {
                grid.innerHTML = "<p style='color:#ff4d4d; grid-column: 1/-1; text-align:center;'>فشل في قراءة الملف المضغوط.</p>";
            }
        }

        async function renderZipFolder(internalPath) {
            currentInternalPath = internalPath;
            updateBackButtonVisibility();
            const grid = document.getElementById('items-grid');
            const pathTitle = document.getElementById('path-title');
            grid.innerHTML = "";
            pathTitle.textContent = `Videos ${internalPath ? ' / ' + internalPath : ''}`;

            let foldersSet = new Set();
            let filesMap = {};

            Object.keys(currentZipData.files).forEach(filename => {
                if (filename.startsWith('__MACOSX/') || filename.includes('/._')) return;
                if (!filename.startsWith(internalPath)) return;
                
                let relativePath = filename.substring(internalPath.length);
                if (relativePath === "" || relativePath === "/") return;

                let parts = relativePath.split('/');
                let firstPart = parts[0];

                if (parts.length > 1 || currentZipData.files[filename].dir) {
                    if (firstPart) foldersSet.add(firstPart);
                } else {
                    filesMap[firstPart] = filename;
                }
            });

            // عرض المجلدات الفرعية
            foldersSet.forEach(folderName => {
                let card = document.createElement('div');
                card.className = "folder-card";
                card.innerHTML = `<div class="folder-icon">📁</div><div class="folder-title">${folderName}</div>`;
                card.onclick = () => renderZipFolder(internalPath + folderName + "/");
                grid.appendChild(card);
            });

            // عرض الفيديوهات والصور بستايل المعرض
            for (let fileName in filesMap) {
                let fullZipPath = filesMap[fileName];
                let ext = fileName.split('.').pop().toLowerCase();
                if (!['mp4', 'mkv', 'webm', 'mov', 'jpg', 'jpeg', 'png'].includes(ext)) continue;

                let card = document.createElement('div');
                card.className = "card";
                
                if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) {
                    card.innerHTML = `
                        <div class="card-overlay">
                            <span class="card-duration" id="dur-${fileName}">00:00</span>
                            <span class="card-title">${fileName}</span>
                        </div>
                    `;
                } else {
                    card.innerHTML = `<div class="card-overlay"><span class="card-title">${fileName}</span></div>`;
                }

                grid.appendChild(card);

                let fileData = currentZipData.files[fullZipPath];
                let blob = await fileData.async("blob");
                let blobUrl = URL.createObjectURL(blob);

                if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) {
                    extractVideoThumb(blobUrl, card, fileName);
                    card.onclick = () => playVideo(fileName, blobUrl);
                } else {
                    let img = document.createElement('img');
                    img.className = "card-thumb";
                    img.src = blobUrl;
                    card.insertBefore(img, card.firstChild);
                    card.onclick = () => window.open(blobUrl, '_blank');
                }
            }
        }

        function extractVideoThumb(videoUrl, cardElement, fileName) {
            const video = document.createElement('video');
            video.src = videoUrl;
            video.muted = true;
            video.playsInline = true;
            video.currentTime = 1.0;

            video.onloadeddata = () => {
                video.currentTime = 0.5;
            };

            video.onseeked = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 300;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                let img = document.createElement('img');
                img.className = "card-thumb";
                img.src = canvas.toDataURL('image/jpeg', 0.7);
                cardElement.insertBefore(img, cardElement.firstChild);

                let mins = Math.floor(video.duration / 60);
                let secs = Math.floor(video.duration % 60);
                let timeStr = (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
                let durSpan = cardElement.querySelector(`#dur-${fileName}`);
                if (durSpan) durSpan.textContent = timeStr;
            };
        }

        function playVideo(title, url) {
            document.getElementById('app-content').style.display = "none";
            document.getElementById('player-container').style.display = "block";
            document.getElementById('video-title').textContent = title;
            
            let videoSource = document.getElementById('video-source');
            videoSource.src = url;
            let videoElement = document.getElementById('main-video');
            videoElement.load();
        }

        function closePlayer() {
            let videoElement = document.getElementById('main-video');
            videoElement.pause();
            document.getElementById('player-container').style.display = "none";
            document.getElementById('app-content').style.display = "block";
        }
    </script>

</body>
</html>
